<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NO LINK = BROWSE DIALOG</title>
<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: black;
  position: relative;
  font-family: Arial, sans-serif;
}
.background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('1.jpg');
  background-size: cover;
  background-position: center;
  transition: opacity 0.4s ease;
  z-index: 1;
  filter: contrast(1.2) saturate(1.4) brightness(1.1);
}
.gradient-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,0,255,0.4);
  animation: bodyGradient 2.5s infinite linear, septicFlash 0.2s infinite;
  z-index: 2;
}
.border {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  border: 12px solid transparent;
  border-image-slice: 1;
  border-image-source: linear-gradient(45deg,magenta,deeppink,red,purple);
  border-image-repeat: stretch;
  animation: borderPulse 0.7s infinite, septicShock 0.12s infinite;
  z-index: 3;
}
@keyframes septicShock {
  0% { transform: translate(0,0) }
  15% { transform: translate(-3px,2px) skew(1.5deg) }
  30% { transform: translate(3px,-2px) skew(-1.5deg) }
  100% { transform: translate(0,0) }
}
@keyframes septicFlash {
  0%,90%,100% { opacity: 1 }
  95% { opacity: 0.8; filter: brightness(2) }
}
@keyframes bodyGradient {
  0% { filter: hue-rotate(0deg) }
  100% { filter: hue-rotate(360deg) }
}
@keyframes borderPulse {
  0% { border-color: magenta }
  50% { border-color: cyan }
  100% { border-color: magenta }
}
.grid-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  display: grid;
  grid-template-columns: repeat(10,80px);
  grid-template-rows: repeat(5,80px);
  gap: 10px;
  z-index: 10;
}
.box {
  width: 80px;
  height: 80px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: transparent;
  border: 3px solid transparent;
  border-radius: 15px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 900;
  color: white;
  animation: neonBlink 1s infinite alternate;
  box-shadow: inset 0 0 0 3px var(--neon-color,magenta),
              0 0 10px var(--neon-color),
              0 0 20px var(--neon-color);
  text-align: center;
}
@keyframes neonBlink {
  0% { text-shadow: 0 0 10px cyan }
  100% { text-shadow: 0 0 20px magenta }
}
.box:nth-child(odd) { --neon-color: magenta }
.box:nth-child(even) { --neon-color: cyan }
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
}
.modal-content {
  background: #fefefe;
  margin: 15% auto;
  padding: 20px;
  border-radius: 10px;
  width: 80%;
  max-width: 400px;
  position: relative;
  text-align: center;
}
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}
.link-button {
  display: inline-block;
  background: blue;
  color: #fff;
  padding: 12px 24px;
  margin-top: 10px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  font-weight: 900;
  min-width: 120px;
}
.browse-box {
  border: 4px solid lime;
  box-shadow: 0 0 20px lime;
  animation: septicShock 0.1s infinite;
}
</style>
</head>
<body>

<div class="background"></div>
<div class="gradient-overlay"></div>
<div class="border"></div>
<div class="grid-container" id="grid"></div>

<!-- DIALOG 1 -->
<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeAll()">×</span>
    <p>CLICK THIS LINK HERE:</p>
    <button class="link-button" id="noLinkBtn">No Link</button>
  </div>
</div>

<!-- DIALOG 2 - BROWSE MAIN PAGE -->
<div id="browseModal" class="modal">
  <div class="modal-content browse-box">
    <span class="close" onclick="closeAll()">×</span>
    <p style="font-weight:900;font-size:18px;color:blue;">BROWSING MAIN PAGE...</p>
    <p>Septic Shock Main</p>
    <button class="link-button" style="background:lime;color:black;" onclick="goMain()">GO TO MAIN</button>
  </div>
</div>

<script>
let index = 1;
const totalImages = 13;
const bg = document.querySelector('.background');

setInterval(() => {
  bg.style.opacity = 0;
  setTimeout(() => {
    bg.style.backgroundImage = `url('${index}.jpg')`;
    bg.style.opacity = 1;
    index = (index % 13) + 1;
  }, 400);
}, 2000);

const container = document.getElementById('grid');
for (let i = 0; i < 50; i++) {
  let b = document.createElement('div');
  b.className = 'box';
  b.innerText = 'Septic Shock';
  b.onclick = () => {
    document.getElementById('myModal').style.display = 'block';
  };
  container.appendChild(b);
}

function closeAll() {
  document.getElementById('myModal').style.display = 'none';
  document.getElementById('browseModal').style.display = 'none';
}

function goMain() {
  closeAll();
  // NEW TAB MAIN PAGE
  window.open('index.html', '_blank');
  // OR SAME TAB KUNG GUSTO MO:
  // window.location.href = 'index.html';
}

// NO LINK CLICK = NEW TAB BROWSE MAIN PAGE + BROWSE DIALOG BOX
document.getElementById('noLinkBtn').addEventListener('click', function(e) {
  e.preventDefault();
  document.getElementById('myModal').style.display = 'none';
  
  setTimeout(() => {
    document.getElementById('browseModal').style.display = 'block';
    // AUTO NEW TAB MAIN PAGE AFTER CLICK NO LINK
    window.open(window.location.href, '_blank');
    // PALITAN MO 'index.html' KUNG MAY MAIN PAGE FILE KA:
    // window.open('main.html', '_blank');
  }, 200);
});

window.onclick = (e) => {
  if (e.target === document.getElementById('myModal')) {
    document.getElementById('myModal').style.display = 'none';
  }
  if (e.target === document.getElementById('browseModal')) {
    closeAll();
  }
};
</script>

</body>
</html>
